name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell syntax and ASCII
        shell: pwsh
        run: |
          foreach ($ps1 in 'setup-ai-ssh.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/$ps1", [ref]$null, [ref]$errors)
            if ($errors) { $errors | Out-String | Write-Error; exit 1 }
            if ([IO.File]::ReadAllBytes("$PWD/$ps1") | Where-Object { $_ -gt 127 }) { Write-Error "$ps1 must stay ASCII"; exit 1 }
          }
