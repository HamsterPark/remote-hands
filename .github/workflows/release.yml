name: Release

# Push a tag like v0.1.0 to build the programs and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./... && go test -count=1 ./...
      - name: Build
        run: VERSION="$GITHUB_REF_NAME" ./scripts/build.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Remote Hands $GITHUB_REF_NAME" \
            --notes "Start here: https://github.com/${GITHUB_REPOSITORY}#readme - the guide shows the one line to paste. The files below are the program for each system; SHA256SUMS lets the installers check the downloads." \
            --generate-notes

  # Install the published release exactly as users do, on every system.
  installers:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      REMOTE_HANDS_NO_START: '1'
      REMOTE_HANDS_NO_SHORTCUTS: '1'
    steps:
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.ps1" | iex
          & "$env:LOCALAPPDATA\Programs\RemoteHands\remote-hands.exe" --version
      - name: macOS / Linux installer
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" | sh
          "$HOME/.local/bin/remote-hands" --version
